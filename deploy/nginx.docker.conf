# 容器里用的 nginx 配置（Dockerfile 会拷进去）。容器只开 80 端口，https 交给前面的反向代理或 CDN。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /config.js  { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /custom.css { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache" always; }

    location / { try_files $uri /index.html; }
}
