# ThesisMind Web 的 nginx 示例：静态托管 + 单页应用回落。
# 把 server_name、证书路径、root 换成你自己的。必须走 https。

server {
    listen 443 ssl http2;
    server_name www.example.com;

    ssl_certificate     /etc/letsencrypt/live/www.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;

    root /var/www/web;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 带内容哈希的产物：可以长期缓存
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 配置、自定义样式、入口页不缓存：改了马上生效，发新版也不会拿着旧入口去要不存在的文件
    location = /config.js  { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /custom.css { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache" always; }

    # 单页应用：刷新 /projects 这类地址也回到 index.html
    location / { try_files $uri /index.html; }
}

server {
    listen 80;
    server_name www.example.com;
    location / { return 301 https://$host$request_uri; }
}
